name: Reportar un error
description: Documenta un comportamiento incorrecto de la beta.
title: "[ERROR] "
labels:
  - error
body:
  - type: dropdown
    id: module
    attributes:
      label: Módulo
      options:
        - Topografía
        - Urbanismo / subdivisión
        - Láminas y cajetín
        - Coordenadas GNSS
        - Instalación o actualización
        - Licencia
        - Interfaz
        - Otro
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Versión DOMUM
      description: Ejecuta DOMUMVERSION en AutoCAD.
      placeholder: 0.28.0-beta-feedback
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Pasos para reproducirlo
      placeholder: Describe qué hiciste, qué esperabas y qué ocurrió.
    validations:
      required: true
  - type: textarea
    id: evidence
    attributes:
      label: Evidencia no confidencial
      description: Puedes adjuntar una captura o el texto del diagnóstico. No adjuntes planos o datos de clientes.
  - type: checkboxes
    id: privacy
    attributes:
      label: Privacidad
      options:
        - label: Confirmo que eliminé datos personales, coordenadas sensibles y archivos de clientes.
          required: true
