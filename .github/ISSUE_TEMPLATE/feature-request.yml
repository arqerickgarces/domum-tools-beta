name: Proponer una mejora
description: Comparte una sugerencia para DOMUM Tools.
title: "[SUGERENCIA] "
labels:
  - sugerencia
body:
  - type: dropdown
    id: module
    attributes:
      label: Módulo
      options:
        - Topografía
        - Urbanismo / subdivisión
        - Láminas y cajetín
        - Coordenadas GNSS
        - Instalación o actualización
        - Licencia
        - Interfaz
        - Otro
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Mejora propuesta
      placeholder: Describe qué deseas mejorar y cómo debería funcionar.
    validations:
      required: true
  - type: textarea
    id: benefit
    attributes:
      label: Beneficio esperado
      placeholder: Explica qué problema resolvería o qué trabajo simplificaría.
  - type: checkboxes
    id: privacy
    attributes:
      label: Privacidad
      options:
        - label: Confirmo que no incluí planos, coordenadas ni datos de clientes.
          required: true
